<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetLife Brasil - Baixe o App</title>

  <!-- Meta tags para o preview no WhatsApp -->
  <meta property="og:title" content="MetLife Brasil">
  <meta property="og:description" content="Baixe o app da MetLife Brasil na loja do seu celular">
  <meta property="og:image" content="https://play-lh.googleusercontent.com/6ujjcqRoENwqIDIzpe6-1DGdxDLINL2QBgnJXpxfmT8ky0K1eBFAeqNSuLUytMPQtSk">
  <meta property="og:type" content="website">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #00857C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; opacity: 0.85; margin-bottom: 32px; }
    .buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    .btn {
      display: block;
      background: #fff;
      color: #00857C;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.15s ease;
    }
    .btn.secondary {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.6);
    }
    .btn:active { transform: scale(0.97); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Abrindo o app...</h1>
  <p id="subtitle">Se não abrir automaticamente, toque na opção abaixo</p>

  <div class="buttons">
    <a class="btn" id="openBtn" href="#">Abrir o app</a>
    <a class="btn secondary hidden" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR">
      Baixar na Google Play
    </a>
    <a class="btn secondary hidden" id="iosBtn" href="https://apps.apple.com/br/app/metlife-brasil/id1625752674">
      Baixar na App Store
    </a>
  </div>

  <script>
  (() => {
    "use strict";

    const APP = {
      scheme: "cssapp",
      path: "brSelfServiceapp",
      android: {
        pkg: "com.metlife.brazil.business.css",
        store: "https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR"
      },
      ios: { store: "https://apps.apple.com/br/app/metlife-brasil/id1625752674" },
      delay: 2000,
      flag: "css:lastTry",
      cooldown: 8000            // "acabou de tentar" só vale por 8s
    };

    const COPY = {
      fail:    { t: "Não conseguimos abrir o app", s: "Talvez ele não esteja instalado neste celular.", c: "Tentar abrir novamente" },
      desktop: { t: "Escolha sua loja",            s: "Detectamos que você está no computador" },
      inapp:   { t: "Abra no navegador",           s: "Toque no menu (•••) e escolha “Abrir no navegador” para continuar.", c: "Abrir o app" }
    };

    const $ = (id) => document.getElementById(id);
    const ui = {
      spinner: $("spinner"), title: $("title"), subtitle: $("subtitle"),
      open: $("openBtn"), android: $("androidBtn"), ios: $("iosBtn")
    };
    const show = (n, on) => n && n.classList.toggle("hidden", !on);
    const say  = (n, v)  => { if (n) n.textContent = v; };

    /* ─── plataforma ─── */
    const ua = navigator.userAgent || "";

    // navegadores DE VERDADE: nunca tratar como WebView
    const isRealBrowser = /\b(CriOS|FxiOS|EdgiOS|OPiOS|OPT|SamsungBrowser|DuckDuckGo|Brave)\b/.test(ua);

    // WebViews que sabotam deep links — tokens explícitos, não palavras soltas
    const isInApp = !isRealBrowser && (
      /FBAN|FBAV|FB_IAB|FBIOS|Instagram|MicroMessenger|LinkedInApp|Snapchat|Pinterest/.test(ua) ||
      /\bLine\//.test(ua) ||
      /Twitter for/.test(ua) ||
      /;\s*wv\)/.test(ua)      // Android System WebView genérica
    );

    const isAndroid = /android/i.test(ua);
    const isIOS = /iP(?:hone|ad|od)/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    /* ─── urls ─── */
    const deepLink = `${APP.scheme}://${APP.path}${location.search}`;
    const intentUrl = `intent://${APP.path}${location.search}#Intent` +
      `;scheme=${APP.scheme};package=${APP.android.pkg}` +
      `;S.browser_fallback_url=${encodeURIComponent(APP.android.store)};end`;

    /* ─── flag com validade ─── */
    const read  = () => Number(sessionStorage.getItem(APP.flag) || 0);
    const arm   = () => { try { sessionStorage.setItem(APP.flag, String(Date.now())); } catch {} };
    const clear = () => { try { sessionStorage.removeItem(APP.flag); } catch {} };
    const justTried = Date.now() - read() < APP.cooldown;

    /* ─── saiu da página ─── */
    const ac = new AbortController();
    const opt = { signal: ac.signal, passive: true };
    let left = false;
    const markLeft = () => { left = true; clear(); ac.abort(); };  // abriu o app: limpa o flag
    document.addEventListener("visibilitychange", () => document.hidden && markLeft(), opt);
    window.addEventListener("pagehide", markLeft, opt);

    /* ─── telas ─── */
    const renderFail = (href, storeBtn) => {
      if (left || document.hidden) return;
      clear();                                  // próxima tentativa é limpa
      show(ui.spinner, false);
      say(ui.title, COPY.fail.t);
      say(ui.subtitle, COPY.fail.s);
      say(ui.open, COPY.fail.c);
      ui.open?.setAttribute("href", href);
      show(ui.open, true);
      show(storeBtn, true);
    };

    const renderInApp = (href, storeBtn) => {
      show(ui.spinner, false);
      say(ui.title, COPY.inapp.t);
      say(ui.subtitle, COPY.inapp.s);
      say(ui.open, COPY.inapp.c);
      ui.open?.setAttribute("href", href);
      show(ui.open, true);
      show(storeBtn, true);
    };

    const renderDesktop = () => {
      show(ui.spinner, false);
      say(ui.title, COPY.desktop.t);
      say(ui.subtitle, COPY.desktop.s);
      show(ui.open, false);
      show(ui.android, true);
      show(ui.ios, true);
    };

    /* ─── fluxo ─── */
    // Android: auto-try com custom scheme (sem Intent). Intent só no toque —
    // sem gesto o Chrome ignora o app e segue S.browser_fallback_url (loja).
    // Timeout nunca navega sozinho para a loja: só mostra UI de falha + CTAs.
    if (isAndroid) {
      show(ui.android, true);
      if (isInApp)    return renderInApp(intentUrl, ui.android);
      if (justTried)  return renderFail(intentUrl, ui.android);
      arm();
      location.replace(deepLink);
      const timer = setTimeout(() => renderFail(intentUrl, ui.android), APP.delay);
      ac.signal.addEventListener("abort", () => clearTimeout(timer), { once: true });
      return;
    }

    if (isIOS) {
      show(ui.ios, true);
      if (isInApp)    return renderInApp(deepLink, ui.ios);
      if (justTried)  return renderFail(deepLink, ui.ios);        // ← era renderInApp: o bug
      arm();
      location.replace(deepLink);
      const timer = setTimeout(() => renderFail(deepLink, ui.ios), APP.delay);
      ac.signal.addEventListener("abort", () => clearTimeout(timer), { once: true });
      return;
    }

    renderDesktop();
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetLife Brasil - Baixe o App</title>

  <!-- Meta tags para o preview no WhatsApp -->
  <meta property="og:title" content="MetLife Brasil">
  <meta property="og:description" content="Baixe o app da MetLife Brasil na loja do seu celular">
  <meta property="og:image" content="https://play-lh.googleusercontent.com/6ujjcqRoENwqIDIzpe6-1DGdxDLINL2QBgnJXpxfmT8ky0K1eBFAeqNSuLUytMPQtSk">
  <meta property="og:type" content="website">

  <style>
/* Fallbacks for local test (on AEM these come from global CSS) */
@font-face {
  font-family: 'MetLifeCircular';
  src: url('https://www.metlife.com.br/content/dam/globalMarketingPlatformAssets/fonts/MetLifeCircular/MetLifeCircular-Medium.woff2') format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: 'MetLifeCircular';
  src: url('https://www.metlife.com.br/content/dam/globalMarketingPlatformAssets/fonts/MetLifeCircular/MetLifeCircular-Bold.woff2') format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}
body {
  margin: 0;
  background: #fff;
  color: #333;
  font-family: 'Noto Sans', Arial, Helvetica, sans-serif;
}
.hidden { display: none !important; }
.font-header-4 {
  font-family: 'MetLifeCircular', Arial, Helvetica, sans-serif;
  font-weight: 500;
  font-size: 24px;
  line-height: 30px;
  letter-spacing: -0.54px;
}
.font-body-1 {
  font-family: 'Noto Sans', Arial, Helvetica, sans-serif;
  font-weight: 400;
  font-size: 16px;
  line-height: 30px;
  letter-spacing: -0.16px;
}
.btn-brand-1st,
.btn-brand-3rd {
  font-family: 'Noto Sans', Arial, Helvetica, sans-serif;
  font-weight: 600;
  line-height: 24px;
  font-size: 16px;
  display: inline-block;
  width: auto;
  min-width: 40px;
  text-align: center;
  border: 0 solid transparent;
  border-radius: 8px;
  padding: 16px 24px;
  margin: 0 auto;
  text-decoration: none;
  height: 54px;
  box-sizing: border-box;
}
.btn-brand-1st { color: #fff; background-color: #007abc; }
.btn-brand-1st:hover,
.btn-brand-1st:focus,
.btn-brand-1st:active { color: #fff; background-color: #0061a0; }
.btn-brand-3rd {
  color: #007abc;
  background-color: #fff;
  border: solid 2px #007abc;
  padding: 14px 22px;
}
.btn-brand-3rd:hover,
.btn-brand-3rd:focus,
.btn-brand-3rd:active {
  color: #fff;
  border: solid 2px #0061a0;
  background-color: #0061a0;
}
.ml-app-redirect { min-height: 100vh; }

/* Layout only — buttons/type/hidden reuse site classes (btn-brand-*, font-*, .hidden) */
.ml-app-redirect {
  box-sizing: border-box;
  background: #fff;
  color: #333;
  min-height: 50vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
}
.ml-app-redirect *,
.ml-app-redirect *::before,
.ml-app-redirect *::after { box-sizing: border-box; }
.ml-app-redirect__buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin-top: 8px;
}
.ml-app-redirect__buttons .btn-brand-1st,
.ml-app-redirect__buttons .btn-brand-3rd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 100%;
}
/* Ícones das lojas (DAM Encontrar um Dentista) — 20×20, gap 8px */
.ml-app-redirect__btn-icon {
  width: 20px;
  height: 20px;
  margin-right: 8px;
  flex: 0 0 auto;
}
/* Hover claro: SVGs têm fill #0061A0 fixo e somem em fundo azul */
.ml-app-redirect__buttons .btn-brand-3rd:hover,
.ml-app-redirect__buttons .btn-brand-3rd:focus,
.ml-app-redirect__buttons .btn-brand-3rd:active {
  color: #0061a0;
  background-color: #f2f2f2;
  border-color: #0061a0;
}
.ml-app-redirect #title { margin: 0 0 8px; color: #333; }
.ml-app-redirect #subtitle { margin: 0 0 32px; color: #75787b; }
.ml-app-redirect .spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(0, 122, 188, 0.25);
  border-top-color: #007abc;
  border-radius: 50%;
  animation: ml-app-spin 0.8s linear infinite;
  margin-bottom: 24px;
}
@keyframes ml-app-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<section class="ml-app-redirect" aria-live="polite">
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <h1 class="font-header-4" id="title">Abrindo o app...</h1>
  <p class="font-body-1" id="subtitle">Se não abrir automaticamente, toque na opção abaixo</p>

  <div class="ml-app-redirect__buttons">
    <a class="btn-brand-1st" id="openBtn" href="#">Abrir o app</a>
    <a class="btn-brand-3rd hidden" id="iosBtn" href="https://apps.apple.com/br/app/metlife-brasil/id1625752674">
      <img
        class="ml-app-redirect__btn-icon"
        src="https://www.metlife.com.br/content/dam/metlifecom/br/homepage/images/individual/planos-odontologicos/encontrare-um-dentista/icons/IOS.svg"
        alt=""
        aria-hidden="true"
      /><span>Baixar na App Store</span>
    </a>
    <a class="btn-brand-3rd hidden" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR">
      <img
        class="ml-app-redirect__btn-icon"
        src="https://www.metlife.com.br/content/dam/metlifecom/br/homepage/images/individual/planos-odontologicos/encontrare-um-dentista/icons/Android.svg"
        alt=""
        aria-hidden="true"
      /><span>Baixar na Google Play</span>
    </a>
  </div>
</section>

<script>
  (() => {
    "use strict";

    const APP_SCHEME = "cssapp://home";
    const ANDROID_PACKAGE = "com.metlife.brazil.business.css";
    const ANDROID_STORE = "https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR";
    const IOS_STORE = "https://apps.apple.com/br/app/metlife-brasil/id1625752674";
    const FALLBACK_MS = 1800;

    const $ = (id) => document.getElementById(id);
    const ui = {
      spinner: $("spinner"),
      title: $("title"),
      subtitle: $("subtitle"),
      open: $("openBtn"),
      android: $("androidBtn"),
      ios: $("iosBtn")
    };
    const show = (n, on) => n && n.classList.toggle("hidden", !on);

    const ua = navigator.userAgent || navigator.vendor || window.opera || "";
    const isAndroid = /android/i.test(ua);
    const isIOS = /iP(?:hone|ad|od)/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    const deepLink = APP_SCHEME + (location.search || "");
    const intentUrl =
      "intent://home" + (location.search || "") +
      "#Intent;scheme=cssapp;package=" + ANDROID_PACKAGE +
      ";S.browser_fallback_url=" + encodeURIComponent(ANDROID_STORE) + ";end";

    function openAppOrStore(appUrl, storeUrl) {
      let appLikelyOpened = false;
      const markOpened = () => { appLikelyOpened = true; };

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) markOpened();
      });
      window.addEventListener("pagehide", markOpened);
      window.addEventListener("blur", markOpened);

      window.location.href = appUrl;

      setTimeout(() => {
        if (!appLikelyOpened && !document.hidden) {
          window.location.href = storeUrl;
        }
      }, FALLBACK_MS);
    }

    if (isAndroid) {
      show(ui.open, false);
      show(ui.android, true);
      ui.open?.setAttribute("href", intentUrl);
      openAppOrStore(intentUrl, ANDROID_STORE);
      return;
    }

    if (isIOS) {
      show(ui.open, false);
      show(ui.ios, true);
      ui.open?.setAttribute("href", deepLink);
      openAppOrStore(deepLink, IOS_STORE);
      return;
    }

    show(ui.spinner, false);
    show(ui.open, false);
    show(ui.android, true);
    show(ui.ios, true);
    ui.title.textContent = "Escolha sua loja";
    ui.subtitle.textContent = "Detectamos que você está no computador";
  })();
</script>
</body>
</html>

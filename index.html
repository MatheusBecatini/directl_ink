<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetLife Brasil - Baixe o App</title>

  <!-- Meta tags para o preview no WhatsApp -->
  <meta property="og:title" content="MetLife Brasil">
  <meta property="og:description" content="Baixe o app da MetLife Brasil na loja do seu celular">
  <meta property="og:image" content="https://play-lh.googleusercontent.com/6ujjcqRoENwqIDIzpe6-1DGdxDLINL2QBgnJXpxfmT8ky0K1eBFAeqNSuLUytMPQtSk">
  <meta property="og:type" content="website">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #00857C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; opacity: 0.85; margin-bottom: 32px; }
    .buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    .btn {
      display: block;
      background: #fff;
      color: #00857C;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.15s ease;
    }
    .btn.secondary {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.6);
    }
    .btn:active { transform: scale(0.97); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Abrindo o app...</h1>
  <p id="subtitle">Se não abrir automaticamente, toque na opção abaixo</p>

  <div class="buttons">
    <a class="btn" id="openBtn" href="#">Abrir o app</a>
    <a class="btn secondary hidden" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR">
      Baixar na Google Play
    </a>
    <a class="btn secondary hidden" id="iosBtn" href="https://apps.apple.com/br/app/metlife-brasil/id1625752674">
      Baixar na App Store
    </a>
  </div>

  <script>
  (() => {
    "use strict";

    const APP = {
      scheme: "cssapp",
      path: "brSelfServiceapp",
      android: {
        pkg: "com.metlife.brazil.business.css",
        store: "https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR"
      },
      ios: { store: "https://apps.apple.com/br/app/metlife-brasil/id1625752674" },
      delay: 2000,
      flag: "css:lastTry",
      cooldown: 8000            // "acabou de tentar" só vale por 8s
    };

    const COPY = {
      fail:    { t: "Não conseguimos abrir o app", s: "Talvez ele não esteja instalado neste celular.", c: "Tentar abrir novamente" },
      desktop: { t: "Escolha sua loja",            s: "Detectamos que você está no computador" },
      inapp:   { t: "Abra no navegador",           s: "Toque no menu (•••) e escolha “Abrir no navegador” para continuar.", c: "Abrir o app" }
    };

    const $ = (id) => document.getElementById(id);
    const ui = {
      spinner: $("spinner"), title: $("title"), subtitle: $("subtitle"),
      open: $("openBtn"), android: $("androidBtn"), ios: $("iosBtn")
    };
    const show = (n, on) => n && n.classList.toggle("hidden", !on);
    const say  = (n, v)  => { if (n) n.textContent = v; };

    // #region agent log
    const __dbg = (hypothesisId, location, message, data) => {
      const payload = {
        sessionId: "1d2311",
        runId: "pre-fix",
        hypothesisId,
        location,
        message,
        data: data || {},
        timestamp: Date.now(),
        build: "ff11856-dbg1"
      };
      try {
        const prev = JSON.parse(sessionStorage.getItem("css:dbg") || "[]");
        prev.push(payload);
        sessionStorage.setItem("css:dbg", JSON.stringify(prev.slice(-40)));
      } catch {}
      try {
        let panel = document.getElementById("dbgPanel");
        if (!panel) {
          panel = document.createElement("pre");
          panel.id = "dbgPanel";
          panel.style.cssText = "position:fixed;left:0;right:0;bottom:0;max-height:28vh;overflow:auto;margin:0;padding:8px;background:rgba(0,0,0,.85);color:#0f0;font:10px/1.35 monospace;z-index:99999;white-space:pre-wrap";
          document.body.appendChild(panel);
        }
        panel.textContent = (panel.textContent ? panel.textContent + "\n" : "") +
          `[${hypothesisId}] ${message} ${JSON.stringify(data || {})}`;
      } catch {}
      fetch("http://127.0.0.1:7349/ingest/daeda454-fcf3-481b-8488-b5607394f35f", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Debug-Session-Id": "1d2311" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    };
    // #endregion

    /* ─── plataforma ─── */
    const ua = navigator.userAgent || "";

    // navegadores DE VERDADE: nunca tratar como WebView
    const isRealBrowser = /\b(CriOS|FxiOS|EdgiOS|OPiOS|OPT|SamsungBrowser|DuckDuckGo|Brave)\b/.test(ua);

    // WebViews que sabotam deep links — tokens explícitos, não palavras soltas
    const isInApp = !isRealBrowser && (
      /FBAN|FBAV|FB_IAB|FBIOS|Instagram|MicroMessenger|LinkedInApp|Snapchat|Pinterest/.test(ua) ||
      /\bLine\//.test(ua) ||
      /Twitter for/.test(ua) ||
      /;\s*wv\)/.test(ua)      // Android System WebView genérica
    );

    const isAndroid = /android/i.test(ua);
    const isIOS = /iP(?:hone|ad|od)/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    /* ─── urls ─── */
    const deepLink = `${APP.scheme}://${APP.path}${location.search}`;
    // Intent sem fallback: abre o app direto (sem o aviso do cssapp://).
    // Não usar S.browser_fallback_url no auto-open — sem gesto o Chrome ia
    // direto pra loja e pulava o app.
    const intentLaunch = `intent://${APP.path}${location.search}#Intent` +
      `;scheme=${APP.scheme};package=${APP.android.pkg};end`;
    // Intent com loja: só no toque do usuário (gesto válido).
    const intentUrl = `intent://${APP.path}${location.search}#Intent` +
      `;scheme=${APP.scheme};package=${APP.android.pkg}` +
      `;S.browser_fallback_url=${encodeURIComponent(APP.android.store)};end`;

    /* ─── flag com validade ─── */
    const read  = () => Number(sessionStorage.getItem(APP.flag) || 0);
    const arm   = () => { try { sessionStorage.setItem(APP.flag, String(Date.now())); } catch {} };
    const clear = () => { try { sessionStorage.removeItem(APP.flag); } catch {} };
    const justTried = Date.now() - read() < APP.cooldown;

    // #region agent log
    __dbg("H4", "index.html:boot", "platform+urls", {
      isIOS, isAndroid, isInApp, isRealBrowser, justTried,
      deepLink, openHref: ui.open && ui.open.getAttribute("href"),
      iosHref: ui.ios && ui.ios.getAttribute("href"),
      ua: ua.slice(0, 160)
    });
    // #endregion

    /* ─── saiu da página ─── */
    const ac = new AbortController();
    const opt = { signal: ac.signal, passive: true };
    let left = false;
    const markLeft = () => {
      // #region agent log
      __dbg("H3", "index.html:markLeft", "page hidden/left", { hidden: document.hidden, leftBefore: left });
      // #endregion
      left = true; clear(); ac.abort();
    };  // abriu o app: limpa o flag
    document.addEventListener("visibilitychange", () => document.hidden && markLeft(), opt);
    window.addEventListener("pagehide", markLeft, opt);

    // Toque em "Abrir o app" cancela o timeout da loja (no iOS o diálogo do
    // Safari não esconde a página — senão o redirect da loja ganhava a corrida).
    ui.open?.addEventListener("click", (e) => {
      // #region agent log
      __dbg("H1", "index.html:openClick", "openBtn clicked", {
        href: ui.open && ui.open.getAttribute("href"),
        aborted: ac.signal.aborted,
        left,
        targetId: e.target && (e.target.id || e.target.tagName)
      });
      // #endregion
      ac.abort();
    }, { passive: true });

    // #region agent log
    ui.ios?.addEventListener("click", (e) => {
      __dbg("H2", "index.html:iosBtnClick", "App Store button clicked", {
        href: ui.ios && ui.ios.getAttribute("href"),
        targetId: e.target && (e.target.id || e.target.tagName)
      });
    }, { passive: true });
    // #endregion

    const goToStore = (storeUrl) => {
      // #region agent log
      __dbg("H3", "index.html:goToStore", "goToStore called", {
        storeUrl, left, hidden: document.hidden, aborted: ac.signal.aborted
      });
      // #endregion
      if (left || document.hidden) return;
      clear();
      location.replace(storeUrl);
    };

    /* ─── telas ─── */
    const renderFail = (href, storeBtn) => {
      // #region agent log
      __dbg("H4", "index.html:renderFail", "renderFail", {
        href, storeBtnId: storeBtn && storeBtn.id, left, hidden: document.hidden
      });
      // #endregion
      if (left || document.hidden) return;
      clear();                                  // próxima tentativa é limpa
      show(ui.spinner, false);
      say(ui.title, COPY.fail.t);
      say(ui.subtitle, COPY.fail.s);
      say(ui.open, COPY.fail.c);
      ui.open?.setAttribute("href", href);
      show(ui.open, true);
      show(storeBtn, true);
      // #region agent log
      __dbg("H1", "index.html:renderFail:after", "open href after renderFail", {
        openHref: ui.open && ui.open.getAttribute("href"),
        iosHidden: ui.ios && ui.ios.classList.contains("hidden"),
        androidHidden: ui.android && ui.android.classList.contains("hidden")
      });
      // #endregion
    };

    const renderInApp = (href, storeBtn) => {
      // #region agent log
      __dbg("H4", "index.html:renderInApp", "renderInApp", { href, storeBtnId: storeBtn && storeBtn.id });
      // #endregion
      show(ui.spinner, false);
      say(ui.title, COPY.inapp.t);
      say(ui.subtitle, COPY.inapp.s);
      say(ui.open, COPY.inapp.c);
      ui.open?.setAttribute("href", href);
      show(ui.open, true);
      show(storeBtn, true);
    };

    const renderDesktop = () => {
      show(ui.spinner, false);
      say(ui.title, COPY.desktop.t);
      say(ui.subtitle, COPY.desktop.s);
      show(ui.open, false);
      show(ui.android, true);
      show(ui.ios, true);
    };

    /* ─── fluxo padrão: tenta app → se falhar, loja ─── */
    if (isAndroid) {
      // #region agent log
      __dbg("H4", "index.html:android", "android branch", { isInApp, justTried });
      // #endregion
      show(ui.android, true);
      if (isInApp)    return renderInApp(intentUrl, ui.android);
      if (justTried)  return renderFail(intentUrl, ui.android);
      arm();
      location.replace(intentLaunch);
      const timer = setTimeout(() => goToStore(APP.android.store), APP.delay);
      ac.signal.addEventListener("abort", () => clearTimeout(timer), { once: true });
      return;
    }

    if (isIOS) {
      // #region agent log
      __dbg("H4", "index.html:ios", "ios branch", { isInApp, justTried, deepLink });
      // #endregion
      show(ui.ios, true);
      show(ui.open, true);
      ui.open?.setAttribute("href", deepLink);
      if (isInApp)    return renderInApp(deepLink, ui.ios);
      if (justTried)  return renderFail(deepLink, ui.ios);
      arm();
      // #region agent log
      __dbg("H5", "index.html:ios:auto", "auto deepLink replace", {
        deepLink, openHref: ui.open && ui.open.getAttribute("href")
      });
      // #endregion
      location.replace(deepLink);
      // Não ir sozinho à App Store: o prompt “Abrir?” do Safari mantém a página
      // visível; o timeout mandava pra loja e o toque em Abrir perdia a corrida.
      // Se falhar, mostra CTAs — loja só no toque explícito.
      const timer = setTimeout(() => {
        // #region agent log
        __dbg("H3", "index.html:ios:timeout", "ios timeout fired → renderFail (not store)", {
          left, hidden: document.hidden, aborted: ac.signal.aborted
        });
        // #endregion
        renderFail(deepLink, ui.ios);
      }, APP.delay);
      ac.signal.addEventListener("abort", () => clearTimeout(timer), { once: true });
      return;
    }

    renderDesktop();
  })();
  </script>
</body>
</html>

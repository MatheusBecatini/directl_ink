<body>

<!-- ===== INICIO DO COMPONENTE AEM — copiar daqui ===== -->
<style>
.ml-app-redirect { min-height: 100vh; }

/* Layout only — buttons/type/hidden reuse site classes (btn-brand-*, font-*, .hidden) */
.ml-app-redirect {
  box-sizing: border-box;
  background: #fff;
  color: #333;
  min-height: 50vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
}
.ml-app-redirect *,
.ml-app-redirect *::before,
.ml-app-redirect *::after { box-sizing: border-box; }
.ml-app-redirect__buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  max-width: 320px;
  margin-top: 8px;
}
.ml-app-redirect__buttons .btn-brand-1st,
.ml-app-redirect__buttons .btn-brand-3rd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 100%;
}
/* Ícones das lojas (DAM Encontrar um Dentista) — 20×20, gap 8px */
.ml-app-redirect__btn-icon {
  width: 20px;
  height: 20px;
  margin-right: 8px;
  flex: 0 0 auto;
}
/* Hover claro: SVGs têm fill #0061A0 fixo e somem em fundo azul */
.ml-app-redirect__buttons .btn-brand-3rd:hover,
.ml-app-redirect__buttons .btn-brand-3rd:focus,
.ml-app-redirect__buttons .btn-brand-3rd:active {
  color: #0061a0;
  background-color: #f2f2f2;
  border-color: #0061a0;
}
.ml-app-redirect #title { margin: 0 0 8px; color: #333; }
.ml-app-redirect #subtitle { margin: 0 0 32px; color: #75787b; }
.ml-app-redirect .spinner {
  width: 40px;
  height: 40px;
  border: 4px solid rgba(0, 122, 188, 0.25);
  border-top-color: #007abc;
  border-radius: 50%;
  animation: ml-app-spin 0.8s linear infinite;
  margin-bottom: 24px;
}
@keyframes ml-app-spin { to { transform: rotate(360deg); } }

.ml-app-redirect .hidden { display: none !important; }
/* Ocupa espaço (layout estável) mas intocável / invisível. */
.ml-app-redirect .veiled { visibility: hidden !important; pointer-events: none !important; }

</style>

<section class="ml-app-redirect" aria-live="polite">
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <h1 class="font-header-4" id="title">Abrindo o app...</h1>
  <p class="font-body-1" id="subtitle">Se não abrir automaticamente, toque na opção abaixo</p>

  <div class="ml-app-redirect__buttons">
    <a class="btn-brand-1st" id="openBtn" href="#">Abrir o app</a>
    <a class="btn-brand-3rd hidden" id="iosBtn" href="https://apps.apple.com/br/app/metlife-brasil/id1625752674">
      <img
        class="ml-app-redirect__btn-icon"
        src="https://www.metlife.com.br/content/dam/metlifecom/br/homepage/images/individual/planos-odontologicos/encontrare-um-dentista/icons/IOS.svg"
        alt=""
        aria-hidden="true"
      /><span>Baixar na App Store</span>
    </a>
    <a class="btn-brand-3rd hidden" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR">
      <img
        class="ml-app-redirect__btn-icon"
        src="https://www.metlife.com.br/content/dam/metlifecom/br/homepage/images/individual/planos-odontologicos/encontrare-um-dentista/icons/Android.svg"
        alt=""
        aria-hidden="true"
      /><span>Baixar na Google Play</span>
    </a>
  </div>
</section>

<script>
  (() => {
    "use strict";

    const APP = {
      scheme: "cssapp",
      path: "brSelfServiceapp",
      android: {
        pkg: "com.metlife.brazil.business.css",
        store: "https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR"
      },
      ios: { store: "https://apps.apple.com/br/app/metlife-brasil/id1625752674" },
      delay: 2000,
      iosDelay: 3000,           // iOS: mais tempo para o prompt “Abrir?”
      storeArmDelay: 1000,      // iOS: botão da loja só fica tocável após isso
      iosStoreGrace: 4000,      // iOS: recheck antes da loja (app pode estar abrindo)
      flag: "css:lastTry",
      cooldown: 8000            // "acabou de tentar" só vale por 8s
    };

    const COPY = {
      fail:    { t: "Não conseguimos abrir o app", s: "Talvez ele não esteja instalado neste celular.", c: "Tentar abrir novamente" },
      desktop: { t: "Escolha sua loja",            s: "Detectamos que você está no computador" },
      inapp:   { t: "Abra no navegador",           s: "Toque no menu (•••) e escolha “Abrir no navegador” para continuar.", c: "Abrir o app" }
    };

    const root = document.querySelector(".ml-app-redirect");
    const $ = (id) => root && root.querySelector("#" + id);
    const ui = {
      spinner: $("spinner"), title: $("title"), subtitle: $("subtitle"),
      open: $("openBtn"), android: $("androidBtn"), ios: $("iosBtn")
    };
    const show = (n, on) => n && n.classList.toggle("hidden", !on);
    const veil = (n, on) => n && n.classList.toggle("veiled", !!on);
    const say  = (n, v)  => { if (n) n.textContent = v; };

    /* ─── plataforma ─── */
    const ua = navigator.userAgent || "";

    // navegadores DE VERDADE: nunca tratar como WebView
    const isRealBrowser = /\b(CriOS|FxiOS|EdgiOS|OPiOS|OPT|SamsungBrowser|DuckDuckGo|Brave)\b/.test(ua);

    // WebViews que sabotam deep links — tokens explícitos, não palavras soltas
    const isInApp = !isRealBrowser && (
      /FBAN|FBAV|FB_IAB|FBIOS|Instagram|MicroMessenger|LinkedInApp|Snapchat|Pinterest/.test(ua) ||
      /\bLine\//.test(ua) ||
      /Twitter for/.test(ua) ||
      /;\s*wv\)/.test(ua)      // Android System WebView genérica
    );

    const isAndroid = /android/i.test(ua);
    const isIOS = /iP(?:hone|ad|od)/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    /* ─── urls ─── */
    // ?dl=<deep link encodado> deixa o time mobile testar variantes sem redeploy.
    // O param "dl" é removido da query repassada ao app.
    const params = new URLSearchParams(location.search);
    const dlOverride = params.get("dl");
    params.delete("dl");
    // AEM/campanha: não vazam wcmmode/utm_*/gclid/... para o deep link.
    const DROP = /^(wcmmode|gclid|fbclid|mc_cid|mc_eid)$|^utm_/i;
    for (const k of [...params.keys()]) if (DROP.test(k)) params.delete(k);
    const qs = params.toString();
    const qsSuffix = qs ? `?${qs}` : "";
    // URLSearchParams.get já decodifica %XX; não chamar decodeURIComponent de novo.
    const deepLink = dlOverride || `${APP.scheme}://${APP.path}${qsSuffix}`;
    // Intent sem fallback: abre o app direto (sem o aviso do cssapp://).
    // Não usar S.browser_fallback_url no auto-open — sem gesto o Chrome ia
    // direto pra loja e pulava o app.
    const intentLaunch = `intent://${APP.path}${qsSuffix}#Intent` +
      `;scheme=${APP.scheme};package=${APP.android.pkg};end`;
    // Intent com loja: só no toque do usuário (gesto válido).
    const intentUrl = `intent://${APP.path}${qsSuffix}#Intent` +
      `;scheme=${APP.scheme};package=${APP.android.pkg}` +
      `;S.browser_fallback_url=${encodeURIComponent(APP.android.store)};end`;

    /* ─── flag com validade ─── */
    const read  = () => Number(sessionStorage.getItem(APP.flag) || 0);
    const arm   = () => { try { sessionStorage.setItem(APP.flag, String(Date.now())); } catch {} };
    const clear = () => { try { sessionStorage.removeItem(APP.flag); } catch {} };
    const justTried = Date.now() - read() < APP.cooldown;

    /* ─── saiu da página ─── */
    const ac = new AbortController();
    const opt = { signal: ac.signal, passive: true };
    let left = false;
    const markLeft = () => { left = true; clear(); ac.abort(); };  // abriu o app: limpa o flag
    document.addEventListener("visibilitychange", () => document.hidden && markLeft(), opt);
    window.addEventListener("pagehide", markLeft, opt);

    // Toque em "Abrir o app" cancela o timeout (no iOS o diálogo do Safari
    // não esconde a página — senão a UI de falha ganhava a corrida).
    ui.open?.addEventListener("click", () => { ac.abort(); }, { passive: true });

    const goToStore = (storeUrl) => {
      if (left || document.hidden || ac.signal.aborted) return;
      clear();
      location.replace(storeUrl);
    };

    /* ─── telas ─── */
    // gateStore: no iOS, o botão da loja fica veiled (intocável) e só arma
    // após storeArmDelay — evita toque perdido no prompt nativo.
    const renderFail = (href, storeBtn, gateStore) => {
      if (left || document.hidden) return;
      clear();                                  // próxima tentativa é limpa
      veil(ui.spinner, true);                   // oculta sem refluir o layout
      say(ui.title, COPY.fail.t);
      say(ui.subtitle, COPY.fail.s);
      say(ui.open, COPY.fail.c);
      ui.open?.setAttribute("href", href);
      show(ui.open, true);
      show(storeBtn, true);
      if (gateStore && storeBtn) {
        veil(storeBtn, true);
        setTimeout(() => veil(storeBtn, false), APP.storeArmDelay);
      } else {
        veil(storeBtn, false);
      }
    };

    const renderInApp = (href, storeBtn) => {
      veil(ui.spinner, true);
      say(ui.title, COPY.inapp.t);
      say(ui.subtitle, COPY.inapp.s);
      say(ui.open, COPY.inapp.c);
      ui.open?.setAttribute("href", href);
      show(ui.open, true);
      show(storeBtn, true);
      veil(storeBtn, false);
    };

    const renderDesktop = () => {
      veil(ui.spinner, true);
      say(ui.title, COPY.desktop.t);
      say(ui.subtitle, COPY.desktop.s);
      show(ui.open, false);
      show(ui.android, true);
      show(ui.ios, true);
      veil(ui.android, false);
      veil(ui.ios, false);
    };

    /* ─── AEM author / iframe: sem auto-open nem redirect ─── */
    const isAemAuthor = window.self !== window.top ||
      /[?&]wcmmode=(edit|preview|design)\b/i.test(location.search);
    if (isAemAuthor) {
      ui.open?.setAttribute("href", deepLink);
      show(ui.open, true);
      show(ui.android, true);
      show(ui.ios, true);
      return;
    }

    /* ─── fluxo padrão: tenta app → se falhar, loja ─── */
    if (isAndroid) {
      show(ui.android, true);
      if (isInApp)    return renderInApp(intentUrl, ui.android);
      if (justTried)  return renderFail(intentUrl, ui.android, false);
      arm();
      location.replace(intentLaunch);
      const timer = setTimeout(() => goToStore(APP.android.store), APP.delay);
      ac.signal.addEventListener("abort", () => clearTimeout(timer), { once: true });
      return;
    }

    if (isIOS) {
      show(ui.open, true);
      ui.open?.setAttribute("href", deepLink);
      // Reserva o espaço do botão da loja (layout estável) mas fica intocável
      // até a falha ser confirmada — evita toque perdido sob o prompt nativo.
      show(ui.ios, true);
      veil(ui.ios, true);

      if (isInApp)    return renderInApp(deepLink, ui.ios);
      if (justTried)  return renderFail(deepLink, ui.ios, true);

      // Se o app abrir e voltar (flash), markLeft deixa left=true e o timeout
      // não renderiza. Ao voltar à página, mostra a UI de falha em vez do
      // spinner infinito. Só age se left===true (não no pageshow inicial).
      // Android não precisa disso (vai à loja em 2s).
      const onReturn = () => {
        if (document.hidden || !left) return;
        left = false;
        renderFail(deepLink, ui.ios, true);
      };
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) onReturn();
      }, { passive: true });
      window.addEventListener("pageshow", onReturn, { passive: true });

      arm();
      location.replace(deepLink);
      // Sem o app, o Safari mostra “endereço inválido” e a página segue visível.
      // Com o app, o prompt “Abrir?” também mantém a página visível — por isso a
      // ida à loja passa por um recheck: se o app estiver abrindo, a página fica
      // oculta dentro do grace e goToStore desiste.
      let storeTimer = 0;
      const timer = setTimeout(() => {
        renderFail(deepLink, ui.ios, true);
        storeTimer = setTimeout(() => goToStore(APP.ios.store), APP.iosStoreGrace);
      }, APP.iosDelay);
      ac.signal.addEventListener("abort", () => {
        clearTimeout(timer);
        clearTimeout(storeTimer);
      }, { once: true });
      return;
    }

    renderDesktop();
  })();
  </script>
<!-- ===== FIM DO COMPONENTE AEM ===== -->

</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetLife Brasil - Baixe o App</title>

  <!-- Meta tags para o preview no WhatsApp -->
  <meta property="og:title" content="MetLife Brasil">
  <meta property="og:description" content="Baixe o app da MetLife Brasil na loja do seu celular">
  <meta property="og:image" content="https://play-lh.googleusercontent.com/6ujjcqRoENwqIDIzpe6-1DGdxDLINL2QBgnJXpxfmT8ky0K1eBFAeqNSuLUytMPQtSk">
  <meta property="og:type" content="website">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #00857C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 20px; margin-bottom: 8px; font-weight: 600; }
    p { font-size: 14px; opacity: 0.85; margin-bottom: 32px; }
    .buttons { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
    .btn {
      display: block;
      background: #fff;
      color: #00857C;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.15s ease;
    }
    .btn.secondary {
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.6);
    }
    .btn:active { transform: scale(0.97); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Abrindo o app...</h1>
  <p id="subtitle">Se não abrir automaticamente, toque na opção abaixo</p>

  <div class="buttons">
    <a class="btn" id="openBtn" href="#">Abrir o app</a>
    <a class="btn secondary hidden" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.metlife.brazil.business.css&hl=pt_BR">
      Baixar na Google Play
    </a>
    <a class="btn secondary hidden" id="iosBtn" href="https://apps.apple.com/br/app/metlife-brasil/id1625752674">
      Baixar na App Store
    </a>
  </div>

  <script>
  (function () {
    "use strict";

    var APP_SCHEME      = "cssapp://home";
    var ANDROID_PACKAGE = "com.metlife.brazil.business.css";
    var ANDROID_STORE   = "https://play.google.com/store/apps/details?id=" + ANDROID_PACKAGE + "&hl=pt_BR";
    var IOS_STORE       = "https://apps.apple.com/br/app/metlife-brasil/id1625752674";

    var ua        = navigator.userAgent || navigator.vendor || window.opera || "";
    var isAndroid = /android/i.test(ua);
    var isIOS     = (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) ||
                    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    var spinner    = document.getElementById("spinner");
    var title      = document.getElementById("title");
    var subtitle   = document.getElementById("subtitle");
    var openBtn    = document.getElementById("openBtn");
    var androidBtn = document.getElementById("androidBtn");
    var iosBtn     = document.getElementById("iosBtn");

    function buildAndroidIntent(scheme) {
      var m = scheme.match(/^([a-z][a-z0-9+.\-]*):\/\/(.*)$/i) || [];
      var schemeName = m[1] || "https";
      var path = (m[2] || "").replace(/^\/+/, "") || "open";
      return "intent://" + path +
             "#Intent;scheme=" + schemeName +
             ";package=" + ANDROID_PACKAGE +
             ";S.browser_fallback_url=" + encodeURIComponent(ANDROID_STORE) +
             ";end";
    }

    // ---------- estado de "saiu da pagina" ----------
    var left = false;
    function markLeft() { left = true; }
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) markLeft();
    });
    window.addEventListener("pagehide", markLeft);
    window.addEventListener("blur", markLeft);

    function gaveUp(storeBtn) {
      spinner.classList.add("hidden");
      title.textContent = "Nao conseguimos abrir o app";
      subtitle.textContent = "Talvez ele nao esteja instalado neste celular.";
      openBtn.textContent = "Tentar abrir novamente";
      if (storeBtn) storeBtn.classList.remove("hidden");
    }

    function run() {
      // ---------------- ANDROID ----------------
      if (isAndroid) {
        var intentUrl = buildAndroidIntent(APP_SCHEME);
        openBtn.setAttribute("href", intentUrl);
        androidBtn.classList.remove("hidden");

        window.location.replace(intentUrl);
        return;
      }

      // ---------------- iOS ----------------
      if (isIOS) {
        openBtn.setAttribute("href", APP_SCHEME);

        var TIMEOUT = 2500;
        var start = Date.now();

        window.location.replace(APP_SCHEME);

        setTimeout(function () {
          var drift = Date.now() - start;
          if (left || document.hidden || drift > TIMEOUT + 400) return;
          gaveUp(iosBtn);
        }, TIMEOUT);
        return;
      }

      // ---------------- DESKTOP ----------------
      spinner.classList.add("hidden");
      title.textContent = "Escolha sua loja";
      subtitle.textContent = "Detectamos que voce esta no computador";
      openBtn.classList.add("hidden");
      androidBtn.classList.remove("hidden");
      iosBtn.classList.remove("hidden");
    }

    run();
  })();
  </script>
</body>
</html>
